<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="assetShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="50" fill="#F9FAFB" />
  <g filter="url(#assetShadow)">
    <ellipse cx="48" cy="50" rx="16" ry="16" fill="url(#coinGradient)" opacity="0.7" />
    <ellipse cx="48" cy="50" rx="12" ry="12" fill="none" stroke="white" stroke-width="2" />
    <text x="48" y="56" font-size="16" font-weight="bold" fill="white" text-anchor="middle">₩</text>
  </g>
  <g filter="url(#assetShadow)">
    <ellipse cx="65" cy="55" rx="18" ry="18" fill="url(#coinGradient)" />
    <ellipse cx="65" cy="55" rx="14" ry="14" fill="none" stroke="white" stroke-width="2.5" />
    <text x="65" y="62" font-size="18" font-weight="bold" fill="white" text-anchor="middle">₩</text>
  </g>
  <g filter="url(#assetShadow)">
    <ellipse cx="52" cy="68" rx="14" ry="14" fill="url(#coinGradient)" opacity="0.8" />
    <ellipse cx="52" cy="68" rx="10" ry="10" fill="none" stroke="white" stroke-width="2" />
    <text x="52" y="74" font-size="14" font-weight="bold" fill="white" text-anchor="middle">₩</text>
  </g>
  <ellipse cx="58" cy="58" rx="18" ry="18" fill="#34D399" opacity="0.15" filter="blur(10px)" />
</svg>

<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="receiptGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9FAFB" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>
    <linearGradient id="coinTaxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="taxShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="50" fill="#F9FAFB" />
  <g filter="url(#taxShadow)">
    <path d="M40 30 L80 30 L80 85 L75 80 L70 85 L65 80 L60 85 L55 80 L50 85 L45 80 L40 85 Z" fill="url(#receiptGradient)" />
    <rect x="48" y="38" width="24" height="2" rx="1" fill="#D1D5DB" />
    <rect x="48" y="44" width="20" height="2" rx="1" fill="#D1D5DB" />
    <rect x="48" y="50" width="18" height="2" rx="1" fill="#D1D5DB" />
    <rect x="48" y="56" width="22" height="2" rx="1" fill="#D1D5DB" />
    <rect x="48" y="62" width="16" height="2" rx="1" fill="#D1D5DB" />
  </g>
  <g filter="url(#taxShadow)">
    <circle cx="70" cy="65" r="12" fill="url(#coinTaxGradient)" />
    <circle cx="70" cy="65" r="9" fill="none" stroke="white" stroke-width="2" />
    <text x="70" y="70" font-size="12" font-weight="bold" fill="white" text-anchor="middle">%</text>
  </g>
  <ellipse cx="58" cy="52" rx="18" ry="18" fill="#34D399" opacity="0.12" filter="blur(10px)" />
</svg>

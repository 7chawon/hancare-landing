    <rect x="42" y="52" width="20" height="2.5" rx="1.25" fill="#D1D5DB" />
  </g>
  <g filter="url(#customShadow)">
    <path d="M75 45C75 45 70 42 60 42C50 42 45 45 45 45C45 45 44 55 45 62C46 69 52 76 60 76C68 76 74 69 75 62C76 55 75 45 75 45Z" fill="url(#customShieldGradient)" />
    <path d="M53 58L57 62L67 50" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <ellipse cx="50" cy="50" rx="15" ry="15" fill="#34D399" opacity="0.12" filter="blur(8px)" />
